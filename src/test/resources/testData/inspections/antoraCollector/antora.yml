name: antora-collector
version: ~
ext:
  collector:
    - scan:
        dir: ./collector-component
    - scan:
        dir: ./collector-page
    - scan:
        dir: ./collector-page-with-base
        base: modules/ROOT/pages
    - scan:
        - dir: ./collector-list-a
          into: modules/ROOT/pages
        - ./collector-list-b
    - scan:
        dir: ./collector-files
        into: modules/ROOT/pages
        files: 'match-*.adoc'
